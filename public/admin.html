<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | AARTI STUDIO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#2E0249',
                            yellow: '#F7CC02',
                            dark: '#0f0518'
                        }
                    },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen pb-20">

    <header class="bg-[#1E1129] border-b border-brand-yellow/20 p-4 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fas fa-crown text-brand-yellow"></i>
                AARTI <span class="text-brand-yellow">MANAGER</span>
            </h1>
            <a href="/" target="_blank" class="text-xs font-bold bg-white/10 hover:bg-brand-yellow hover:text-brand-purple px-4 py-2 rounded-full transition">
                Ver Site Online <i class="fas fa-external-link-alt ml-1"></i>
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <section>
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center">
                <span class="bg-green-500/20 text-green-500 p-2 rounded-lg mr-3 text-lg"><i class="fas fa-inbox"></i></span>
                Mensagens Recebidas
            </h2>
            <div class="bg-[#1E1129] rounded-2xl border border-white/5 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto max-h-[600px] overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-brand-purple z-10">
                            <tr class="text-brand-yellow uppercase text-xs font-bold">
                                <th class="p-4">Data</th>
                                <th class="p-4">Cliente</th>
                                <th class="p-4">Mensagem</th>
                            </tr>
                        </thead>
                        <tbody id="messages-list" class="divide-y divide-white/5 text-sm text-gray-300">
                            <tr><td colspan="3" class="p-8 text-center animate-pulse">Carregando leads...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="space-y-8">
            
            <div class="bg-[#1E1129] p-6 rounded-2xl border border-brand-yellow/20 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-brand-yellow/5 rounded-full blur-3xl -mr-10 -mt-10"></div>
                
                <h2 class="text-xl font-bold text-brand-yellow mb-6 flex items-center relative z-10">
                    <i class="fas fa-plus-circle mr-3"></i> Adicionar Novo Serviço
                </h2>
                
                <form id="add-service-form" class="space-y-4 relative z-10">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-gray-500 uppercase font-bold ml-1">Nome do Serviço</label>
                            <input type="text" id="svc-name" placeholder="Ex: Cartão Digital" required class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-brand-yellow focus:outline-none transition">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 uppercase font-bold ml-1">Preço / Valor</label>
                            <input type="text" id="svc-price" placeholder="Ex: R$ 150,00" required class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-brand-yellow focus:outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-gray-500 uppercase font-bold ml-1">Descrição Curta</label>
                        <textarea id="svc-desc" rows="2" placeholder="O que está incluso?" required class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-brand-yellow focus:outline-none transition"></textarea>
                    </div>

                    <div>
                        <label class="text-xs text-gray-500 uppercase font-bold ml-1">Link da Imagem (URL)</label>
                        <input type="url" id="svc-image" placeholder="Cole o link do Google Drive ou outro..." class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-brand-yellow focus:outline-none transition text-xs">
                        <p class="text-[10px] text-gray-500 mt-1">*Pode colar link do Google Drive que o sistema corrige automático.</p>
                    </div>
                    
                    <div>
                        <label class="text-xs text-gray-500 uppercase font-bold ml-1">Ícone</label>
                        <div class="relative">
                            <select id="svc-icon" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-brand-yellow focus:outline-none appearance-none cursor-pointer">
                                <option value="fa-star">★ Estrela (Destaque)</option>
                                <option value="fa-pen-nib">✒️ Design / Logo</option>
                                <option value="fa-video">🎥 Vídeo / Reels</option>
                                <option value="fa-camera">📸 Fotografia</option>
                                <option value="fa-id-card">🪪 Cartão Visita</option>
                                <option value="fa-hashtag">#️⃣ Social Media</option>
                                <option value="fa-laptop-code">💻 Site / Web</option>
                            </select>
                            <div class="absolute right-3 top-3 text-brand-yellow pointer-events-none">▼</div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-brand-yellow text-brand-purple font-bold py-3 rounded-lg hover:bg-white transition transform active:scale-95 shadow-lg">
                        Salvar no Site
                    </button>
                </form>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-6 flex items-center">
                    <i class="fas fa-trash-alt mr-3 text-red-500"></i> Gerenciar Ativos
                </h2>
                <div id="services-list" class="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar pr-2">
                    </div>
            </div>
        </section>

    </main>

    <script>
        // --- FUNÇÕES ---

        // 1. Carregar Mensagens
        async function loadMessages() {
            const list = document.getElementById('messages-list');
            try {
                const res = await fetch('/api/admin/messages');
                const data = await res.json();
                
                if(data.length === 0) {
                    list.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-gray-500">Nenhuma mensagem ainda.</td></tr>';
                    return;
                }

                list.innerHTML = data.map(msg => `
                    <tr class="hover:bg-white/5 transition border-b border-white/5">
                        <td class="p-4 text-gray-500 text-xs whitespace-nowrap">${new Date(msg.created_at).toLocaleDateString()}</td>
                        <td class="p-4">
                            <div class="font-bold text-white">${msg.name}</div>
                            <div class="text-brand-yellow text-xs">${msg.phone}</div>
                        </td>
                        <td class="p-4 italic text-gray-400 text-sm leading-relaxed">${msg.message}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error(e);
                list.innerHTML = '<tr><td colspan="3" class="p-4 text-red-500">Erro ao carregar.</td></tr>';
            }
        }

        // 2. Carregar Serviços
        async function loadServices() {
            const list = document.getElementById('services-list');
            try {
                const res = await fetch('/api/services'); 
                const data = await res.json();

                list.innerHTML = data.map(svc => `
                    <div class="bg-[#1E1129] p-3 rounded-lg border border-white/5 flex justify-between items-center group hover:border-brand-yellow/50 transition">
                        <div class="flex items-center gap-3">
                            <img src="${svc.image_url || 'https://via.placeholder.com/50'}" class="w-10 h-10 rounded object-cover border border-white/10 bg-white/10">
                            <div>
                                <h4 class="font-bold text-white text-sm">${svc.name}</h4>
                                <p class="text-[10px] text-brand-yellow">${svc.price}</p>
                            </div>
                        </div>
                        <button onclick="deleteService(${svc.id})" class="w-8 h-8 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center hover:bg-red-600 hover:text-white transition" title="Excluir Serviço">
                            <i class="fas fa-trash text-xs"></i>
                        </button>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        // Função Mágica: Converte Link do Google Drive
        function formatGoogleDriveLink(url) {
            if (!url) return "";
            if (url.includes("drive.google.com") && url.includes("/d/")) {
                // Extrai o ID entre /d/ e a próxima barra /
                const idMatch = url.match(/\/d\/(.*?)\//);
                if (idMatch && idMatch[1]) {
                    // Retorna o link direto de visualização
                    return `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
                }
            }
            return url;
        }

        // 3. Adicionar Serviço
        document.getElementById('add-service-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const rawImageLink = document.getElementById('svc-image').value;
            const fixedImageLink = formatGoogleDriveLink(rawImageLink);

            const payload = {
                name: document.getElementById('svc-name').value,
                price: document.getElementById('svc-price').value,
                description: document.getElementById('svc-desc').value,
                image_url: fixedImageLink, // Usa o link corrigido
                icon: document.getElementById('svc-icon').value,
            };

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Salvando...";

            try {
                const res = await fetch('/api/admin/services', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    alert('Serviço adicionado com sucesso!');
                    e.target.reset();
                    loadServices(); 
                } else {
                    alert('Erro ao salvar.');
                }
            } catch (error) {
                alert('Erro de conexão.');
            }
            btn.innerText = originalText;
        });

        // 4. Deletar Serviço
        async function deleteService(id) {
            if(confirm('Tem certeza que deseja apagar este serviço do site?')) {
                await fetch(`/api/admin/services/${id}`, { method: 'DELETE' });
                loadServices();
            }
        }

        // --- LOGIN SEGURO ---
        async function checkLogin() {
            if(sessionStorage.getItem('aarti_admin_logged') === 'true') {
                loadMessages();
                loadServices();
                return;
            }

            const pass = prompt("🔐 Área Restrita AARTI STUDIO.\nDigite a senha de administrador:");
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('aarti_admin_logged', 'true');
                    loadMessages();
                    loadServices();
                } else {
                    showAccessDenied();
                }
            } catch (error) {
                showAccessDenied();
            }
        }

        function showAccessDenied() {
            document.body.innerHTML = `
                <div class='h-screen flex flex-col items-center justify-center bg-brand-dark text-white'>
                    <i class="fas fa-lock text-5xl text-red-500 mb-6 animate-pulse"></i>
                    <h1 class='text-3xl font-bold font-serif mb-2'>Acesso Negado</h1>
                    <p class="text-gray-500 mb-6">Senha incorreta.</p>
                    <button onclick="location.reload()" class="bg-brand-yellow text-brand-purple font-bold px-6 py-3 rounded-lg hover:bg-white transition">Tentar novamente</button>
                </div>`;
        }

        // Inicia
        checkLogin();
    </script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f0518; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #570A57; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #F7CC02; }
    </style>
</body>
</html>
