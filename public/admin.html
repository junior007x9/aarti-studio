        // --- LÓGICA DE UPLOAD (CRIAR) ---
        document.getElementById('svc-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const label = document.getElementById('file-label');
            const preview = document.getElementById('preview-img');
            const hiddenInput = document.getElementById('svc-image-base64');

            label.innerText = "Processando...";

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxWidth = 800;
                    const scaleSize = maxWidth / img.width;
                    const newWidth = maxWidth;
                    const newHeight = img.height * scaleSize;

                    canvas.width = newWidth;
                    canvas.height = newHeight;
                    ctx.drawImage(img, 0, 0, newWidth, newHeight);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    hiddenInput.value = dataUrl;
                    preview.src = dataUrl;
                    preview.classList.remove('hidden');
                    label.innerText = file.name;
                }
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('add-service-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const imageCode = document.getElementById('svc-image-base64').value;

            if (!imageCode) {
                alert("Por favor, selecione uma imagem do seu dispositivo.");
                return;
            }

            const payload = {
                name: document.getElementById('svc-name').value,
                price: "", // Enviado vazio para não quebrar o banco de dados
                description: document.getElementById('svc-desc').value,
                image_url: imageCode,
                icon: document.getElementById('svc-icon').value,
            };

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Enviando imagem...";

            try {
                const res = await fetch('/api/admin/services', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    alert('Serviço criado com sucesso!');
                    e.target.reset();
                    document.getElementById('preview-img').classList.add('hidden');
                    document.getElementById('svc-image-base64').value = '';
                    document.getElementById('file-label').innerText = "Clique para enviar foto";

                } else {

                }
            } catch (error) {
                alert('Erro de conexão.');
            }
            btn.innerText = originalText;
        });

        async function deleteService(id) {
            if(confirm('Tem certeza que deseja apagar este serviço?')) {
                await fetch(`/api/admin/services/${id}`, { method: 'DELETE' });
                loadServices();
            }
        }

        async function checkLogin() {
            if(sessionStorage.getItem('aarti_admin_logged') === 'true') {
                loadMessages();
                loadServices();
                return;
            }
            const pass = prompt("🔐 Área Restrita AARTI STUDIO.\nDigite a senha de administrador:");
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('aarti_admin_logged', 'true');
                    loadMessages();
                    loadServices();
                } else {
                    document.body.innerHTML = "<h1 class='text-white text-center mt-20'>Acesso Negado</h1>";
                }
            } catch (error) {
                document.body.innerHTML = "<h1 class='text-white text-center mt-20'>Acesso Negado</h1>";
            }
        }

        checkLogin();
